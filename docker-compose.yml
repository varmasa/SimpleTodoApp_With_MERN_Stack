---
version: "3.8"
services:
    db_service:
        image: saivarma5557/todoapp:mongodb
        container_name: mongo
        restart: always
        ports:
          - "27017:27017"
        volumes:
          - mongo_data:/data/db
        networks:
          - todo-network

    backend_service:
        image: saivarma5557/todoapp:todobackend
        container_name: backendcont
        restart: always
        ports:
          - "5000:5000"
        networks:
          - todo-network
        depends_on:
          - db_service
        environment:
          MONGO_URI: mongodb://db_service:27017/todoapp
          JWT_SECRET: mysecretkey
          PORT: "5000"

    frontend_service:
        image: saivarma5557/todoapp:todofrontend
        container_name: frontendcont
        restart: always
        ports:
          - "5173:5173"
        networks:
          - todo-network
        depends_on:
          - backend_service

    portainer:
        image: portainer/portainer-ce:latest
        container_name: portainer
        restart: always
        ports:
          - "9443:9443"
        volumes:
          - portainer_data:/data
          - /var/run/docker.sock:/var/run/docker.sock
        networks:
          - todo-network

volumes:
  mongo_data:
  portainer_data:
networks:
  todo-network:
...       